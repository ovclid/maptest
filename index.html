<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시장별 구역 지도 – 카카오맵</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }
    #map { width: 100%; height: 100%; }

    .toolbar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      pointer-events: none;
    }
    .toolbar > * { pointer-events: auto; }

    .panel {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      padding: 10px 14px;
      font-size: 13px;
      color: #333;
    }
    .title { font-weight: 700; font-size: 15px; margin-right: 8px; }
    .count { color: #666; }

    .btn {
      border: none;
      background: #fee500;
      color: #3c1e1e;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }
    .btn:hover { background: #f5d800; }
    .btn.secondary {
      background: #fff;
      border: 1px solid #ddd;
      color: #333;
    }
    .btn.secondary:hover { background: #f5f5f5; }

    .sidebar {
      position: absolute;
      top: 70px;
      right: 12px;
      width: 300px;
      max-height: calc(100% - 90px);
      overflow-y: auto;
      z-index: 10;
      background: rgba(255,255,255,0.96);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      display: none;
    }
    .sidebar.open { display: block; }
    .sidebar h3 {
      padding: 14px 16px 8px;
      font-size: 14px;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      background: #fff;
    }
    .zone-group {
      padding: 8px 16px 4px;
      font-size: 12px;
      font-weight: 700;
      color: #555;
      background: #f7f8fa;
      border-bottom: 1px solid #eee;
    }
    .zone-item {
      padding: 10px 16px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.12s;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .zone-item:hover { background: #f7f9fc; }
    .zone-item .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
    }
    .zone-item .addr { color: #222; font-weight: 500; }
    .zone-item .meta { color: #888; font-size: 11px; margin-top: 2px; }

    .info-window {
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.45;
      min-width: 150px;
    }
    .info-window strong { display: block; margin-bottom: 2px; }
    .info-window .sub { color: #666; font-size: 12px; }

    .status {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      display: none;
      max-width: 90%;
      text-align: center;
    }
    .status.show { display: block; }

    .legend {
      position: absolute;
      bottom: 16px;
      left: 12px;
      z-index: 10;
      background: rgba(255,255,255,0.95);
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
      padding: 10px 14px;
      font-size: 12px;
      display: none;
    }
    .legend.show { display: block; }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0;
    }
    .legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1px solid rgba(0,0,0,0.15);
    }

    @media (max-width: 600px) {
      .sidebar { width: calc(100% - 24px); right: 12px; left: 12px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="toolbar">
    <div class="panel">
      <span class="title">📍 시장별 구역 지도</span>
      <span class="count" id="zoneCount">로딩 중…</span>
    </div>
    <button class="btn secondary" id="btnList" type="button">목록</button>
    <button class="btn secondary" id="btnFit" type="button">전체 보기</button>
  </div>

  <div class="sidebar" id="sidebar">
    <h3>구역 목록</h3>
    <div id="zoneList"></div>
  </div>

  <div class="legend" id="legend"></div>
  <div class="status" id="status"></div>

  <!-- SheetJS (엑셀 파싱) -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <!--
    ★ 카카오맵 API 키를 아래에 넣어주세요.
    https://developers.kakao.com/ → JavaScript 키
  -->
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=56dd36038680e4d6f7b1cbc67b011a06&autoload=false"></script>

  <script>
    // ============================================================
    // ★ 같은 폴더(또는 아래 경로)에 있는 엑셀 파일을 자동으로 읽습니다.
    //    파일명/경로만 바꾸면 됩니다. 파일 선택 버튼 없음.
    // ============================================================
    const EXCEL_URL = './양식_결과.xlsx';

    const MARKET_COLORS = [
      { stroke: '#004c80', fill: '#00a0e9' },
      { stroke: '#1a7a3a', fill: '#2ecc71' },
      { stroke: '#8b4513', fill: '#e67e22' },
      { stroke: '#6c3483', fill: '#9b59b6' },
      { stroke: '#922b21', fill: '#e74c3c' },
      { stroke: '#1a5276', fill: '#3498db' },
      { stroke: '#7d3c98', fill: '#af7ac5' },
      { stroke: '#117a65', fill: '#1abc9c' },
    ];

    let map = null;
    let mapData = [];
    let polygons = [];
    let markers = [];
    let infoWindows = [];
    let bounds = null;
    let marketColorMap = {};

    function showStatus(msg) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.classList.add('show');
    }
    function hideStatus() {
      document.getElementById('status').classList.remove('show');
    }
    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getMarketColor(marketName) {
      if (!marketColorMap[marketName]) {
        const idx = Object.keys(marketColorMap).length % MARKET_COLORS.length;
        marketColorMap[marketName] = MARKET_COLORS[idx];
      }
      return marketColorMap[marketName];
    }

    function calcCentroid(lngLatPoints) {
      if (!lngLatPoints.length) return { lat: 0, lng: 0 };
      let sumLat = 0, sumLng = 0;
      for (const p of lngLatPoints) {
        sumLng += p[0];
        sumLat += p[1];
      }
      return {
        lat: sumLat / lngLatPoints.length,
        lng: sumLng / lngLatPoints.length
      };
    }

    function geometryToPaths(geometry) {
      if (!geometry || !geometry.coordinates) return null;

      const type = geometry.type;
      let polygonsRaw = [];
      if (type === 'MultiPolygon') {
        polygonsRaw = geometry.coordinates;
      } else if (type === 'Polygon') {
        polygonsRaw = [geometry.coordinates];
      } else {
        return null;
      }

      const paths = [];
      const allPoints = [];

      for (const polygon of polygonsRaw) {
        for (const ring of polygon) {
          const kakaoRing = [];
          for (const pt of ring) {
            if (!pt || pt.length < 2) continue;
            const lng = Number(pt[0]);
            const lat = Number(pt[1]);
            if (isNaN(lng) || isNaN(lat)) continue;
            kakaoRing.push([lat, lng]);
            allPoints.push([lng, lat]);
          }
          if (kakaoRing.length >= 3) paths.push(kakaoRing);
        }
      }

      if (!paths.length) return null;
      const center = calcCentroid(allPoints);
      return {
        paths: paths,
        center: {
          lat: Math.round(center.lat * 1e8) / 1e8,
          lng: Math.round(center.lng * 1e8) / 1e8
        }
      };
    }

    function parseExcelWorkbook(workbook) {
      const sheetName = workbook.SheetNames.find(function (n) {
        return n === '시장별주소' || n.indexOf('시장별주소') >= 0;
      }) || workbook.SheetNames[0];

      const sheet = workbook.Sheets[sheetName];
      if (!sheet) {
        throw new Error("'시장별주소' 시트를 찾을 수 없습니다.");
      }

      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      if (!rows.length) throw new Error('시트가 비어 있습니다.');

      const header = rows[0].map(function (h) { return String(h).trim(); });
      const colSeq = header.indexOf('순번');
      const colMarket = header.indexOf('소속시장');
      const colAddr = header.indexOf('주소');
      const colBoundary = header.indexOf('경계좌표');

      if (colAddr < 0) throw new Error("'주소' 열을 찾을 수 없습니다.");
      if (colBoundary < 0) {
        throw new Error("'경계좌표' 열이 없습니다. fill_boundary_from_vworld.py 로 먼저 채워 주세요.");
      }

      const items = [];
      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || !row.length) continue;

        const addr = String(row[colAddr] || '').trim();
        const boundaryRaw = String(row[colBoundary] || '').trim();
        const market = colMarket >= 0 ? String(row[colMarket] || '').trim() : '';
        const seq = colSeq >= 0 ? row[colSeq] : i;

        if (!addr && !boundaryRaw) continue;

        let geometry = null;
        if (boundaryRaw) {
          try {
            geometry = JSON.parse(boundaryRaw);
          } catch (e) {
            console.warn('경계좌표 JSON 파싱 실패 (행 ' + (i + 1) + '):', e);
          }
        }

        if (!geometry) {
          console.warn('경계좌표 없음 → 건너뜀: ' + addr);
          continue;
        }

        const converted = geometryToPaths(geometry);
        if (!converted) {
          console.warn('geometry 변환 실패: ' + addr);
          continue;
        }

        items.push({
          seq: seq,
          market: market,
          address: addr,
          name: market ? (market + ' · ' + addr) : addr,
          center: converted.center,
          paths: converted.paths,
          color: getMarketColor(market || addr)
        });
      }

      return items;
    }

    /** 서버(또는 로컬 http 서버)에서 엑셀을 fetch 로 자동 로드 */
    async function loadExcelFromUrl(url) {
      showStatus('엑셀 로딩 중… (' + url + ')');
      const res = await fetch(url);
      if (!res.ok) {
        throw new Error('파일을 가져올 수 없습니다 (HTTP ' + res.status + '). 경로: ' + url);
      }
      const buffer = await res.arrayBuffer();
      const workbook = XLSX.read(buffer, { type: 'array' });
      return parseExcelWorkbook(workbook);
    }

    function clearMapObjects() {
      polygons.forEach(function (p) { p.setMap(null); });
      markers.forEach(function (m) { m.setMap(null); });
      infoWindows.forEach(function (iw) { iw.close(); });
      polygons = [];
      markers = [];
      infoWindows = [];
      bounds = new kakao.maps.LatLngBounds();
    }

    function drawAllZones() {
      clearMapObjects();

      if (!mapData.length) {
        document.getElementById('zoneCount').textContent = '표시할 구역 없음';
        document.getElementById('legend').classList.remove('show');
        return;
      }

      mapData.forEach(function (item, idx) {
        drawZone(item, idx);
      });

      if (!bounds.isEmpty()) {
        map.setBounds(bounds, 40, 40, 40, 40);
      }

      document.getElementById('zoneCount').textContent = mapData.length + '개 필지';
      buildSidebar();
      buildLegend();
      hideStatus();
    }

    function drawZone(item, idx) {
      const path = item.paths[0].map(function (p) {
        return new kakao.maps.LatLng(p[0], p[1]);
      });
      path.forEach(function (ll) { bounds.extend(ll); });

      const style = {
        strokeWeight: 2,
        strokeColor: item.color.stroke,
        strokeOpacity: 0.9,
        fillColor: item.color.fill,
        fillOpacity: 0.32
      };

      const polygon = new kakao.maps.Polygon(Object.assign({ path: path }, style));
      polygon.setMap(map);
      polygons.push(polygon);
      polygon.__baseStyle = style;

      const position = new kakao.maps.LatLng(item.center.lat, item.center.lng);
      const marker = new kakao.maps.Marker({
        position: position,
        title: item.address
      });
      marker.setMap(map);
      markers.push(marker);

      const content =
        '<div class="info-window">' +
          '<strong>' + escapeHtml(item.address) + '</strong>' +
          (item.market
            ? '<div class="sub">' + escapeHtml(item.market) + '</div>'
            : '') +
        '</div>';

      const infowindow = new kakao.maps.InfoWindow({
        content: content,
        removable: true
      });
      infoWindows.push(infowindow);

      function openInfo() {
        closeAllInfoWindows();
        infowindow.open(map, marker);
        highlightPolygon(idx);
      }

      kakao.maps.event.addListener(marker, 'click', openInfo);
      kakao.maps.event.addListener(polygon, 'click', function () {
        openInfo();
        map.panTo(position);
      });
    }

    function highlightPolygon(activeIdx) {
      polygons.forEach(function (poly, i) {
        if (i === activeIdx) {
          poly.setOptions({
            strokeWeight: 3,
            strokeColor: '#c0392b',
            strokeOpacity: 1,
            fillColor: '#e74c3c',
            fillOpacity: 0.4
          });
        } else {
          poly.setOptions(poly.__baseStyle || {
            strokeWeight: 2,
            strokeOpacity: 0.9,
            fillOpacity: 0.32
          });
        }
      });
    }

    function closeAllInfoWindows() {
      infoWindows.forEach(function (iw) { iw.close(); });
    }

    function buildSidebar() {
      const list = document.getElementById('zoneList');
      list.innerHTML = '';

      const groups = {};
      mapData.forEach(function (item, idx) {
        const key = item.market || '(미분류)';
        if (!groups[key]) groups[key] = [];
        groups[key].push({ item: item, idx: idx });
      });

      Object.keys(groups).forEach(function (market) {
        const groupTitle = document.createElement('div');
        groupTitle.className = 'zone-group';
        groupTitle.textContent = market + ' (' + groups[market].length + ')';
        list.appendChild(groupTitle);

        groups[market].forEach(function (entry) {
          const item = entry.item;
          const idx = entry.idx;
          const div = document.createElement('div');
          div.className = 'zone-item';
          div.innerHTML =
            '<span class="dot" style="background:' + item.color.fill + ';border-color:' + item.color.stroke + '"></span>' +
            '<div>' +
              '<div class="addr">' + escapeHtml(item.address) + '</div>' +
              '<div class="meta">순번 ' + escapeHtml(item.seq) + '</div>' +
            '</div>';
          div.addEventListener('click', function () {
            const pos = new kakao.maps.LatLng(item.center.lat, item.center.lng);
            map.setLevel(3);
            map.panTo(pos);
            closeAllInfoWindows();
            infoWindows[idx].open(map, markers[idx]);
            highlightPolygon(idx);
          });
          list.appendChild(div);
        });
      });
    }

    function buildLegend() {
      const el = document.getElementById('legend');
      const markets = Object.keys(marketColorMap);
      if (!markets.length) {
        el.classList.remove('show');
        return;
      }
      el.innerHTML = '<div style="font-weight:700;margin-bottom:6px;">소속시장</div>';
      markets.forEach(function (name) {
        const c = marketColorMap[name];
        const row = document.createElement('div');
        row.className = 'legend-item';
        row.innerHTML =
          '<span class="legend-swatch" style="background:' + c.fill + ';border-color:' + c.stroke + '"></span>' +
          '<span>' + escapeHtml(name) + '</span>';
        el.appendChild(row);
      });
      el.classList.add('show');
    }

    async function initMap() {
      map = new kakao.maps.Map(document.getElementById('map'), {
        center: new kakao.maps.LatLng(36.48, 127.28),
        level: 5
      });
      bounds = new kakao.maps.LatLngBounds();

      try {
        const items = await loadExcelFromUrl(EXCEL_URL);
        mapData = items;
        drawAllZones();
        if (!items.length) {
          showStatus('경계좌표가 채워진 행이 없습니다. fill_boundary_from_vworld.py 를 먼저 실행하세요.');
        }
      } catch (err) {
        console.error(err);
        document.getElementById('zoneCount').textContent = '엑셀 로드 실패';
        showStatus(
          '엑셀 로드 실패: ' + (err.message || err) +
          '  → HTML과 양식_결과.xlsx 를 같은 폴더에 두고, 로컬 서버로 여세요. (python -m http.server 8080)'
        );
      }
    }

    document.getElementById('btnList').addEventListener('click', function () {
      document.getElementById('sidebar').classList.toggle('open');
    });

    document.getElementById('btnFit').addEventListener('click', function () {
      if (bounds && !bounds.isEmpty()) {
        map.setBounds(bounds, 40, 40, 40, 40);
        closeAllInfoWindows();
        highlightPolygon(-1);
      }
    });

    kakao.maps.load(initMap);
  </script>
</body>
</html>
