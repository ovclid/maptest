        // 3. GeoJSON 데이터를 파싱하여 카카오맵에 폴리곤을 그리는 함수
        function displayGeoJSON(data) {
            // 기존 그려진 폴리곤 제거
            polygons.forEach(function(item) {
                item.setMap(null);
            });
            polygons = [];

            var bounds = new kakao.maps.LatLngBounds();

            data.features.forEach(function(feature) {
                var geometry = feature.geometry;
                var properties = feature.properties;

                if (geometry.type === "Polygon" || geometry.type === "MultiPolygon") {
                    var coordinates = geometry.type === "Polygon" ? [geometry.coordinates] : geometry.coordinates;

                    coordinates.forEach(function(polygonCoords) {
                        var path = [];
                        polygonCoords.forEach(function(ring) {
                            ring.forEach(function(coord) {
                                // 카카오맵은 (위도, 경도) 순서이므로 좌표 변환 ([경도, 위도] -> [위도, 경도])
                                var latLng = new kakao.maps.LatLng(coord[1], coord[0]);
                                path.push(latLng);
                                bounds.extend(latLng);
                            });
                        });

                        // 폴리곤 생성
                        var polygon = new kakao.maps.Polygon({
                            path: path,
                            strokeWeight: 2,
                            strokeColor: '#FF0000',
                            strokeOpacity: 0.8,
                            fillColor: '#FFA7A7',
                            fillOpacity: 0.5
                        });

                        polygon.setMap(map);
                        polygons.push(polygon);

                        // 다각형에 마우스 오버/클릭 이벤트 등록
                        kakao.maps.event.addListener(polygon, 'mouseover', function() {
                            polygon.setOptions({fillColor: '#0984e3'});
                        });

                        kakao.maps.event.addListener(polygon, 'mouseout', function() {
                            polygon.setOptions({fillColor: '#FFA7A7'});
                        });

                        kakao.maps.event.addListener(polygon, 'click', function(mouseEvent) {
                            var content = '<div style="padding:10px; font-size:12px; line-height:1.5;">' +
                                '<strong>[구역 정보]</strong><br>' +
                                '지역: ' + (properties.area1 || '정보 없음') + '<br>' +
                                'PNU코드: ' + (properties.pnucode || '-') + '<br>' +
                                '지목: ' + (properties.jimok || '-') + '<br>' +
                                '본번/부번: ' + (properties.bon || '-') + ' / ' + (properties.bu || '-') +
                                '</div>';
                            
                            infowindow.setContent(content);
                            infowindow.setPosition(mouseEvent.latLng);
                            infowindow.open(map);
                        });
                    });
                }
            });

            // 첫 번째 구역 위치로 지도 중심 이동
            if (!bounds.isEmpty()) {
                map.setBounds(bounds);
            }
        }

        // 초기 기본 데이터로 지도 그리기 실행
        displayGeoJSON(defaultGeoJson);

        // 4. 파일 업로드 시 동적으로 GeoJSON 읽어서 시각화하기
        document.getElementById('geojsonFile').addEventListener('change', function(event) {
            var file = event.target.files[0];
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var jsonContent = JSON.parse(e.target.result);
                    displayGeoJSON(jsonContent);
                } catch (error) {
                    alert('올바른 GeoJSON/JSON 파일 형식이 아닙니다.');
                    console.error(error);
                }
            };
            reader.readAsText(file);
        });
    </script>
