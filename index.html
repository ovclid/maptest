<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>구역 지도 – 카카오맵</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }
    #map { width: 100%; height: 100%; }

    .toolbar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      pointer-events: none;
    }
    .toolbar > * { pointer-events: auto; }

    .panel {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      padding: 10px 14px;
      font-size: 13px;
      color: #333;
    }
    .title { font-weight: 700; font-size: 15px; margin-right: 8px; }
    .count { color: #666; }

    .btn {
      border: none;
      background: #fee500;
      color: #3c1e1e;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }
    .btn:hover { background: #f5d800; }
    .btn.secondary {
      background: #fff;
      border: 1px solid #ddd;
      color: #333;
    }
    .btn.secondary:hover { background: #f5f5f5; }

    .sidebar {
      position: absolute;
      top: 70px;
      right: 12px;
      width: 280px;
      max-height: calc(100% - 90px);
      overflow-y: auto;
      z-index: 10;
      background: rgba(255,255,255,0.96);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      display: none;
    }
    .sidebar.open { display: block; }
    .sidebar h3 {
      padding: 14px 16px 8px;
      font-size: 14px;
      border-bottom: 1px solid #eee;
    }
    .zone-item {
      padding: 10px 16px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.12s;
    }
    .zone-item:hover { background: #f7f9fc; }
    .zone-item .addr { color: #222; font-weight: 500; }
    .zone-item .meta { color: #888; font-size: 11px; margin-top: 2px; }

    .info-window {
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.4;
      min-width: 140px;
    }
    .info-window strong { display: block; margin-bottom: 2px; }
    .info-window .sub { color: #666; font-size: 12px; }

    .status {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      display: none;
    }
    .status.show { display: block; }

    @media (max-width: 600px) {
      .sidebar { width: calc(100% - 24px); right: 12px; left: 12px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="toolbar">
    <div class="panel">
      <span class="title">📍 구역 지도</span>
      <span class="count" id="zoneCount">로딩 중…</span>
    </div>
    <button class="btn secondary" id="btnList" type="button">목록</button>
    <button class="btn secondary" id="btnFit" type="button">전체 보기</button>
    <label class="btn secondary" style="cursor:pointer; margin:0;">
      파일 추가
      <input type="file" id="fileInput" accept=".txt,.json,.geojson" multiple hidden />
    </label>
  </div>

  <div class="sidebar" id="sidebar">
    <h3>구역 목록</h3>
    <div id="zoneList"></div>
  </div>

  <div class="status" id="status"></div>

  <!--
    ★ 카카오맵 API 키를 아래에 넣어주세요.
    https://developers.kakao.com/ 에서 앱 등록 후 JavaScript 키 발급
  -->
  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=56dd36038680e4d6f7b1cbc67b011a06&autoload=false"></script>

  <script>
    // ============================================================
    // ★ data/ 폴더에 있는 파일 이름을 여기에 적어주세요.
    //    새 파일을 추가할 때마다 이 배열에 파일명만 추가하면 됩니다.
    //    (브라우저 보안상 폴더 목록을 자동으로 가져올 수 없습니다)
    // ============================================================
    const DATA_FILES = [
      '대평동 668.txt',
      '대평동 700.txt',
      '대평동 668.txt',
    ];

    const DATA_BASE = './data/';

    // ---------- 스타일 ----------
    const POLYGON_STYLE = {
      strokeWeight: 2,
      strokeColor: '#004c80',
      strokeOpacity: 0.85,
      fillColor: '#00a0e9',
      fillOpacity: 0.28
    };
    const HIGHLIGHT_STYLE = {
      strokeWeight: 3,
      strokeColor: '#e74c3c',
      strokeOpacity: 1,
      fillColor: '#e74c3c',
      fillOpacity: 0.35
    };

    // ---------- 상태 ----------
    let map = null;
    let mapData = [];
    let polygons = [];
    let markers = [];
    let infoWindows = [];
    let bounds = null;

    // ============================================================
    // GeoJSON → 카카오맵용 객체 변환
    // ============================================================
    function makeAddress(props) {
      const area1 = (props.area1 || '').replace(/__/g, ' ').trim();
      const bon = props.bon;
      const bu = props.bu || 0;
      if (bon == null) return area1 || '주소 정보 없음';
      if (bu && Number(bu) !== 0) return (area1 + ' ' + bon + '-' + bu).trim();
      return (area1 + ' ' + bon).trim();
    }

    function calcCentroid(points) {
      if (!points.length) return { lat: 0, lng: 0 };
      let sumLat = 0, sumLng = 0;
      for (const p of points) {
        sumLng += p[0];
        sumLat += p[1];
      }
      return {
        lat: sumLat / points.length,
        lng: sumLng / points.length
      };
    }

    function extractFeature(feature, filename) {
      const geom = feature.geometry;
      if (!geom || !geom.coordinates) return null;

      const props = feature.properties || {};
      const type = geom.type;
      let polygonsRaw = [];

      if (type === 'MultiPolygon') {
        polygonsRaw = geom.coordinates;
      } else if (type === 'Polygon') {
        polygonsRaw = [geom.coordinates];
      } else {
        console.warn('지원하지 않는 geometry:', type, filename);
        return null;
      }

      const paths = [];
      const allPoints = [];

      for (const polygon of polygonsRaw) {
        for (const ring of polygon) {
          const kakaoRing = [];
          for (const pt of ring) {
            if (pt.length < 2) continue;
            const lng = Number(pt[0]);
            const lat = Number(pt[1]);
            kakaoRing.push([lat, lng]);
            allPoints.push([lng, lat]);
          }
          if (kakaoRing.length) paths.push(kakaoRing);
        }
      }

      if (!paths.length) return null;

      const center = calcCentroid(allPoints);
      const name = filename.replace(/\.(txt|json|geojson)$/i, '');

      return {
        name: name,
        address: makeAddress(props),
        pnucode: props.pnucode || '',
        admcode: props.admcode || '',
        jimok: props.jimok || '',
        bon: props.bon,
        bu: props.bu || 0,
        area1: props.area1 || '',
        center: {
          lat: Math.round(center.lat * 1e8) / 1e8,
          lng: Math.round(center.lng * 1e8) / 1e8
        },
        paths: paths
      };
    }

    function parseGeoJSON(text, filename) {
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        console.error('JSON 파싱 실패:', filename, e);
        return [];
      }

      let features = [];
      if (data.type === 'FeatureCollection' && Array.isArray(data.features)) {
        features = data.features;
      } else if (data.type === 'Feature') {
        features = [data];
      } else {
        console.warn('알 수 없는 GeoJSON 형식:', filename);
        return [];
      }

      const results = [];
      for (const feat of features) {
        const item = extractFeature(feat, filename);
        if (item) results.push(item);
      }
      return results;
    }

    // ============================================================
    // 데이터 로드
    // ============================================================
    async function loadFromDataFolder() {
      if (!DATA_FILES.length) {
        showStatus('DATA_FILES 배열이 비어 있습니다. index.html에서 파일명을 추가하세요.');
        return [];
      }

      showStatus(DATA_FILES.length + '개 파일 로딩 중…');

      const results = [];
      const tasks = DATA_FILES.map(async function (filename) {
        const url = DATA_BASE + encodeURIComponent(filename);
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const text = await res.text();
          return parseGeoJSON(text, filename);
        } catch (e) {
          console.error('파일 로드 실패: ' + filename, e);
          showStatus('로드 실패: ' + filename);
          return [];
        }
      });

      const all = await Promise.all(tasks);
      for (const items of all) {
        for (const item of items) results.push(item);
      }
      return results;
    }

    async function loadFromFileInput(fileList) {
      const results = [];
      for (const file of fileList) {
        try {
          const text = await file.text();
          const items = parseGeoJSON(text, file.name);
          for (const item of items) results.push(item);
        } catch (e) {
          console.error('파일 읽기 실패:', file.name, e);
        }
      }
      return results;
    }

    // ============================================================
    // 지도 그리기
    // ============================================================
    function clearMapObjects() {
      polygons.forEach(function (p) { p.setMap(null); });
      markers.forEach(function (m) { m.setMap(null); });
      infoWindows.forEach(function (iw) { iw.close(); });
      polygons = [];
      markers = [];
      infoWindows = [];
      bounds = new kakao.maps.LatLngBounds();
    }

    function drawAllZones() {
      clearMapObjects();

      if (!mapData.length) {
        document.getElementById('zoneCount').textContent = '구역 없음';
        return;
      }

      mapData.forEach(function (item, idx) { drawZone(item, idx); });

      if (!bounds.isEmpty()) {
        map.setBounds(bounds, 40, 40, 40, 40);
      }

      document.getElementById('zoneCount').textContent = mapData.length + '개 구역';
      buildSidebar();
      hideStatus();
    }

    function drawZone(item, idx) {
      const path = item.paths[0].map(function (p) {
        return new kakao.maps.LatLng(p[0], p[1]);
      });
      path.forEach(function (ll) { bounds.extend(ll); });

      const polygon = new kakao.maps.Polygon(Object.assign({ path: path }, POLYGON_STYLE));
      polygon.setMap(map);
      polygons.push(polygon);

      const position = new kakao.maps.LatLng(item.center.lat, item.center.lng);
      const marker = new kakao.maps.Marker({
        position: position,
        title: item.address
      });
      marker.setMap(map);
      markers.push(marker);

      const content =
        '<div class="info-window">' +
          '<strong>' + escapeHtml(item.address) + '</strong>' +
          '<div class="sub">' + escapeHtml(item.name) +
            (item.jimok ? ' · ' + escapeHtml(item.jimok) : '') +
          '</div>' +
        '</div>';

      const infowindow = new kakao.maps.InfoWindow({
        content: content,
        removable: true
      });
      infoWindows.push(infowindow);

      function openInfo() {
        closeAllInfoWindows();
        infowindow.open(map, marker);
        highlightPolygon(idx);
      }

      kakao.maps.event.addListener(marker, 'click', openInfo);
      kakao.maps.event.addListener(polygon, 'click', function () {
        openInfo();
        map.panTo(position);
      });
    }

    function highlightPolygon(activeIdx) {
      polygons.forEach(function (poly, i) {
        poly.setOptions(i === activeIdx ? HIGHLIGHT_STYLE : POLYGON_STYLE);
      });
    }

    function closeAllInfoWindows() {
      infoWindows.forEach(function (iw) { iw.close(); });
    }

    function buildSidebar() {
      const list = document.getElementById('zoneList');
      list.innerHTML = '';
      mapData.forEach(function (item, idx) {
        const div = document.createElement('div');
        div.className = 'zone-item';
        div.innerHTML =
          '<div class="addr">' + escapeHtml(item.address) + '</div>' +
          '<div class="meta">' + escapeHtml(item.name) +
            (item.jimok ? ' · ' + escapeHtml(item.jimok) : '') +
          '</div>';
        div.addEventListener('click', function () {
          const pos = new kakao.maps.LatLng(item.center.lat, item.center.lng);
          map.setLevel(3);
          map.panTo(pos);
          closeAllInfoWindows();
          infoWindows[idx].open(map, markers[idx]);
          highlightPolygon(idx);
        });
        list.appendChild(div);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showStatus(msg) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.classList.add('show');
    }
    function hideStatus() {
      document.getElementById('status').classList.remove('show');
    }

    // ============================================================
    // 초기화
    // ============================================================
    async function initMap() {
      map = new kakao.maps.Map(document.getElementById('map'), {
        center: new kakao.maps.LatLng(36.48, 127.28),
        level: 5
      });
      bounds = new kakao.maps.LatLngBounds();

      const items = await loadFromDataFolder();
      mapData = items;
      drawAllZones();

      if (!mapData.length) {
        showStatus('표시할 구역이 없습니다. DATA_FILES를 확인하거나 "파일 추가"를 사용하세요.');
      }
    }

    document.getElementById('btnList').addEventListener('click', function () {
      document.getElementById('sidebar').classList.toggle('open');
    });

    document.getElementById('btnFit').addEventListener('click', function () {
      if (bounds && !bounds.isEmpty()) {
        map.setBounds(bounds, 40, 40, 40, 40);
        closeAllInfoWindows();
        highlightPolygon(-1);
      }
    });

    document.getElementById('fileInput').addEventListener('change', async function (e) {
      const files = e.target.files;
      if (!files || !files.length) return;

      showStatus(files.length + '개 파일 처리 중…');
      const items = await loadFromFileInput(files);
      if (items.length) {
        mapData = mapData.concat(items);
        drawAllZones();
        showStatus(items.length + '개 구역 추가됨 (총 ' + mapData.length + '개)');
        setTimeout(hideStatus, 2500);
      } else {
        showStatus('추가된 구역이 없습니다.');
      }
      e.target.value = '';
    });

    kakao.maps.load(initMap);
  </script>
</body>
</html>
